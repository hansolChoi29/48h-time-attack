server:
  port: 8082

spring:
  application:
    name: delivery-service

  datasource:
    url: jdbc:postgresql://localhost:5433/logistics
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
        alphanumeric-ids:
          enabled: true # Feign에 서킷브레이커를 연결해서 fallbackFactory가 동작하게 만드는 설정

      client:
        config:
          inventory-service:
            connect-timeout: 2000
            read-timeout: 3000

resilience4j:
  circuitbreaker:
    instances:
      InventoryClientreserve:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
